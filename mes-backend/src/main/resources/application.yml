server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: mes-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mes?currentSchema=public}
    username: ${DB_USER:mes}
    password: ${DB_PASSWORD:mes123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
    schemas: public
    default-schema: public
    create-schemas: false
    # 迁移脚本里会写 BPMN 的 ${...} 表达式，关掉占位符替换
    placeholder-replacement: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: always
  web:
    resources:
      static-locations: classpath:/static/

# 探活与运行指标：只开放 health / info，其余要登录
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true

mes:
  jwt:
    secret: ${JWT_SECRET:mes-workshop-secret-key-please-change-in-production-2026}
    expire-hours: 12
  # 跨域来源，多个用逗号分隔；生产改成真实域名，别留 localhost
  cors:
    allowed-origins: ${MES_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  # 演示账号初始口令，只在「库里还没有这个账号」时用一次；生产请改掉
  init-password: ${MES_INIT_PASSWORD:123456}
  security:
    # 必须改初始口令才放行：生产保持 true。
    # 回归脚本（scripts/e2e-*.py）用同一个口令跑全量接口，本地跑回归时用
    # MES_FORCE_PASSWORD_CHANGE=false 起服务即可，别在生产关掉。
    force-password-change: ${MES_FORCE_PASSWORD_CHANGE:true}
  # 手机推送通道：none 表示不接，消息只到站内通知。
  # 接入厂商推送（极光/个推）或公众号模板消息时改成 JPUSH / GETUI / WECHAT，
  # 并新增一个 PushSender 实现（com.mes.push），业务侧不用改。
  push:
    provider: ${MES_PUSH_PROVIDER:none}

# 审批流执行引擎：BPMN 2.0 由 Flowable 执行（并行网关 / 排他网关 / 多实例会签 / 边界定时器）
flowable:
  # 引擎自己建 ACT_* 表，我们的业务表由 Flyway 管，两套互不干扰
  database-schema-update: true
  # 关掉异步作业线程，本项目的定时能力统一在 ScheduledJobs 里
  async-executor-activate: false
  history-level: audit
  # 流程定义走数据库部署（画布保存时生成 BPMN 并部署），不扫描 classpath
  check-process-definitions: false
  # 我们用自己的登录体系，不用 Flowable 的 IDM 表
  idm:
    enabled: false

logging:
  level:
    root: INFO
    com.mes: INFO
    # Flowable 启动日志比较吵，降到 WARN
    org.flowable: WARN
