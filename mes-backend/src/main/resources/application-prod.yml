# 生产环境配置：启动时用 --spring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod
#
# 与 application.yml 的区别只有一个原则：敏感项一律不给默认值。
# 少了任何一个环境变量，服务会直接起不来（Spring 解析不到占位符就报错），
# 而不是像以前那样悄悄用 mes123 / 默认 JWT 密钥跑起来。
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

mes:
  jwt:
    # 至少 32 个字符，建议 openssl rand -base64 48 生成
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${MES_CORS_ORIGINS}
  init-password: ${MES_INIT_PASSWORD}

management:
  endpoint:
    health:
      # 生产不暴露组件细节，只给 UP / DOWN
      show-details: never

logging:
  level:
    root: INFO
    com.mes: INFO
    org.flowable: WARN

# 生产把日志写到挂载卷；路径由 LOG_PATH 环境变量指定，未指定时用工作目录下 logs
